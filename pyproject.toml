[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarposter"
version = "0.1.0"
description = "Cross-post from Mastodon to Bluesky and LinkedIn"
authors = [
    {name = "Dennis Alexis Valin Dittrich", email = "dd+github@dr-dittrich.de"}
]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.0",
    "atproto>=0.0.55",
    "Mastodon.py>=2.0",
    "beautifulsoup4",
    "lxml",
    "Pillow>=10.1.0",
    "sumy",
    "python-dotenv",
    "typer>=0.9",
    "loguru",
    "trafilatura",
    "PyMuPDF",
    "pymupdf4llm",
    "grapheme>=0.6",
    "tomli_w>=1.0",
    "gemini-acp @ git+https://github.com/davdittrich/gemini-acp.git@32ae5c157a35a43ec16f6b67356b9944438e6faa",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "respx>=0.21"]

[project.scripts]
scholarposter = "scholarposter.cli:app"

[tool.setuptools.package-data]
scholarposter = ["data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = ["integration: integration tests (deselect with '-m not integration')"]
